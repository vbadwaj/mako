# Local TPC-C baseline performance test configuration
# Single shard, localhost, minimal warehouses for fast testing

sites:
    - name: "local_s0"
      id: 1
      ip: 127.0.0.1
      port: 31000

shard_map:
    - ["local_s0"]  # Shard 0 with only one node (leader)

warehouses: 1  # warehouses per shard (minimal for fast baseline)

memlocalhost: 31500

bench:
  workload: tpcc
  scale: 1
  weight:
    new_order: 44
    payment: 44
    delivery: 4
    order_status: 4
    stock_level: 4
  population:
    warehouse: 1
    district: 10
    customer: 30000
    history: 30000
    order: 30000
    new_order: 9000
    item: 100000
    stock: 100000
    order_line: 300000

